[project]
name = "leadgen-backend"
version = "0.1.0"
description = "B2B sales-intelligence pipeline + API for a roofing distributor"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "anthropic>=1.0",
    "openai>=2.0",
    "httpx>=0.27",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.pipeline.sources" = ["data/*.json"]
"app.evidence" = ["data/*.json"]
"app.matching" = ["rubrics/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
